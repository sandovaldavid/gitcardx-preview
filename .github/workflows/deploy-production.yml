name: Deploy Production

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run verification gates
        run: |
          bun run format:check
          bun run lint
          bun run typecheck
          bun run test
          bun run build

      - name: Pull Vercel environment
        run: bun x vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build artifacts
        run: bun x vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt
        run: bun x vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
